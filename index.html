<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <title>Nexolú POS</title>
    <script>
      // pos.nexolu.co/ sin sesion -> el home del POS, que vive en nexolu.co/pos
      // (las landings van en nexolu.co a proposito: ver nexolu-sites). Con
      // sesion no pasa nada: las tablets que abren pos.nexolu.co siguen
      // entrando directo a la app.
      //
      // Inline y antes del bundle para que el visitante no descargue la app
      // ni vea un parpadeo del login. No actua si la URL trae fragmento: el
      // SSO vuelve a / con #auth_token= (o #token= del legacy) y todavia no
      // hay token guardado.
      try {
        if (
          location.pathname === '/' &&
          !location.hash &&
          !localStorage.getItem('nexolu_auth_token')
        ) {
          location.replace('https://nexolu.co/pos/' + location.search)
        }
      } catch (e) {
        // localStorage bloqueado (modo privado estricto): se queda en la app.
      }
    </script>
  </head>
  <body>
    <!--
      Pantalla de carga. Aparece apenas llega el HTML, antes de que baje el
      JS y antes de que el router valide la sesion (/me) - sin ella esa espera
      era una pagina en blanco de varios segundos en celular, y un fallo de
      red al cargar dejaba la pantalla en blanco para siempre. main.ts la
      quita cuando la primera navegacion termina. Si a los 15 s sigue aqui,
      ofrece recargar.
    -->
    <div id="boot-splash" role="status" aria-live="polite">
      <style>
        #boot-splash { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #f8fafc; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; color: #475569; text-align: center; padding: 24px; }
        #boot-splash .spin { width: 36px; height: 36px; border: 4px solid #e0e7ff; border-top-color: #4f46e5; border-radius: 50%; animation: boot-spin 0.8s linear infinite; }
        #boot-splash .lento { display: none; max-width: 320px; font-size: 14px; line-height: 1.5; }
        #boot-splash.tarde .lento { display: block; }
        #boot-splash button { margin-top: 12px; padding: 10px 20px; border: 0; border-radius: 10px; background: #4f46e5; color: #fff; font-size: 15px; font-weight: 600; }
        @keyframes boot-spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) { #boot-splash .spin { animation-duration: 2.4s; } }
      </style>
      <div class="spin"></div>
      <div>Cargando Nexolú POS…</div>
      <div class="lento">
        Está tardando más de lo normal. Revisa la conexión a internet.
        <br />
        <button type="button" onclick="location.reload()">Volver a intentar</button>
      </div>
    </div>
    <script>
      setTimeout(function () {
        var splash = document.getElementById('boot-splash')
        if (splash) splash.className = 'tarde'
      }, 15000)
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
